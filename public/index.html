
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi AI Cartoon Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎬 Hindi AI Cartoon Studio</h1>
    <p>अपनी मजेदार हिंदी कार्टून कहानी बनाएं!</p>

    <div class="card">
      <h2>1. कहानी बनाएं</h2>

      <input
        type="text"
        id="topic"
        placeholder="कहानी का विषय लिखें"
      >

      <button id="generateStory">कहानी बनाएं</button>

      <p id="storyStatus"></p>
      <div id="storyResult"></div>
    </div>
<div class="card">
  <h2>2. हिंदी Voice</h2>
  <textarea id="storyText" placeholder="कहानी यहां आएगी"></textarea>
  <button id="voiceButton">Voice बनाएं</button>
</div>
  <div class="card">
  <h2>3. Cartoon Scene</h2>

  <button id="generateScenes">Scenes बनाएं</button>

  <p id="sceneStatus"></p>

  <textarea
    id="sceneResult"
    placeholder="आपके 5 Cartoon Scenes यहां आएंगे"
    rows="12"
  ></textarea>
  </div>
    <div class="card">
  <h2>4. AI Cartoon Image</h2>

  <input
    type="text"
    id="imagePrompt"
    placeholder="तस्वीर का वर्णन लिखें"
  >

  <button id="generateImage">तस्वीर बनाएं</button>

  <p id="imageStatus"></p>
<div id="imageGallery"></div>
  >
    </div>
    <div class="card">
      <h2>5. Final Video</h2>
      <input type="file" accept="video/*" multiple>
      <button>Video तैयार करें</button>
    </div>
  </div>

  <script>
    const topicInput = document.getElementById("topic");
    const generateButton = document.getElementById("generateStory");
    const storyStatus = document.getElementById("storyStatus");
    const storyResult = document.getElementById("storyResult");
const storyText = document.getElementById("storyText");
    generateButton.addEventListener("click", async () => {
      const topic = topicInput.value.trim();

      if (!topic) {
        storyStatus.textContent = "पहले कहानी का विषय लिखिए।";
        return;
      }

      generateButton.disabled = true;
      storyStatus.textContent = "कहानी बन रही है, कृपया इंतजार करें...";
      storyResult.textContent = "";

      try {
        const response = await fetch("/api/story", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ topic })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "कहानी नहीं बन पाई।");
        }

        storyResult.textContent = data.story || "AI ने खाली जवाब दिया।";
        storyText.value = data.story || "";
        storyStatus.textContent = "कहानी तैयार है!";

      } catch (error) {
        storyStatus.textContent = "समस्या: " + error.message;
      } finally {
        generateButton.disabled = false;
      }
    });
    const generateScenes = document.getElementById("generateScenes");
const sceneStatus = document.getElementById("sceneStatus");
const sceneResult = document.getElementById("sceneResult");

generateScenes.addEventListener("click", async () => {
  const story = storyText.value.trim();

  if (!story) {
    sceneStatus.textContent = "पहले कहानी बनाइए!";
    return;
  }
generateScenes.textContent = "⏳ Scenes बन रहे हैं...";
  generateScenes.style.backgroundColor = "#ff9800";
  generateScenes.disabled = true;
  sceneStatus.textContent = "5 Cartoon Scenes बन रहे हैं...";
  sceneResult.value = "";

  try {
    const response = await fetch("/api/scenes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ story })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Scenes नहीं बन पाए।");
    }

    sceneResult.value = data.scenes || "कोई Scene नहीं मिला।";
    sceneStatus.textContent = "5 Cartoon Scenes तैयार हैं!";
  } catch (error) {
    sceneStatus.textContent = "समस्या: " + error.message;
  } finally {
    generateScenes.disabled = false;
    generateScenes.textContent = "Scenes बनाएं";
    generateScenes.style.backgroundColor = "";
  }
});
    const imagePrompt = document.getElementById("imagePrompt");
const generateImage = document.getElementById("generateImage");
const imageGallery = document.getElementById("imageGallery");
    const imageStatus = document.getElementById("imageStatus");
const generatedImage = document.getElementById("generatedImage");

generateImage.addEventListener("click", async () => {
  const prompt = imagePrompt.value.trim();

  if (!prompt) {
    imageStatus.textContent = "पहले तस्वीर का वर्णन लिखिए।";
    return;
  }

  generateImage.disabled = true;
  imageStatus.textContent = "तस्वीर तैयार हो रही है...";

  try {
    const response = await fetch("/api/generate-image", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "तस्वीर नहीं बन पाई।");
    }
const img = document.createElement("img");
img.src = data.image;
img.style.width = "100%";
img.style.maxWidth = "400px";
img.style.margin = "10px 0";
imageGallery.appendChild(img);

imageStatus.textContent = "तस्वीर तैयार है!";
  } catch (error) {
    imageStatus.textContent = "समस्या: " + error.message;
  } finally {
    generateImage.disabled = false;
  }
});
    const voiceButton = document.getElementById("voiceButton");

voiceButton.addEventListener("click", () => {
    
const text = storyText.value
    .replace(/[~`|•√π§{}✓¥°®*]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
    if (!text) {
        alert("पहले कहानी बनाएं!");
        return;
    }

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "hi-IN";
    speech.rate = 0.9;
    speech.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
});
  </script>
</body>
</html>
