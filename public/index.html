
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi AI Cartoon Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎬 Hindi AI Cartoon Studio</h1>
    <p>अपनी मजेदार हिंदी कार्टून कहानी बनाएं!</p>

    <div class="card">
      <h2>1. कहानी बनाएं</h2>

      <input
        type="text"
        id="topic"
        placeholder="कहानी का विषय लिखें"
      >

      <button id="generateStory">कहानी बनाएं</button>

      <p id="storyStatus"></p>
      <div id="storyResult"></div>
    </div>

    <div class="card">
      <h2>2. हिंदी Voice</h2>
      <textarea id="storyText" placeholder="कहानी यहां आएगी"></textarea>
      <button>Voice बनाएं</button>
    </div>

    <div class="card">
      <h2>3. Cartoon Scene</h2>
      <textarea placeholder="Cartoon scene prompt"></textarea>
      <button>Scene बनाएं</button>
    </div>

    <div class="card">
      <h2>4. Final Video</h2>
      <input type="file" accept="video/*" multiple>
      <button>Video तैयार करें</button>
    </div>
  </div>

  <script>
    const topicInput = document.getElementById("topic");
    const generateButton = document.getElementById("generateStory")
    const storyStatus = document.getElementById("storyStatus");
    const storyResult = document.getElementById("storyResult");
const storyText = document.getElementById("storyText");
    generateButton.addEventListener("click", async () => {
      const topic = topicInput.value.trim();

      if (!topic) {
        storyStatus.textContent = "पहले कहानी का विषय लिखिए।";
        return;
      }

      generateButton.disabled = true;
      storyStatus.textContent = "कहानी बन रही है, कृपया इंतजार करें...";
      storyResult.textContent = "";

      try {
        const response = await fetch("/api/story", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ topic })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "कहानी नहीं बन पाई।");
        }

        storyResult.textContent = data.story || "AI ने खाली जवाब दिया।";
        storyText.value = data.story || "";
        storyStatus.textContent = "कहानी तैयार है!";

      } catch (error) {
        storyStatus.textContent = "समस्या: " + error.message;
      } finally {
        generateButton.disabled = false;
      }
    });
  </script>
</body>
</html>
